events {
    worker_connections 1024;  # Максимальное количество подключений на рабочий процесс
}


http {
    server {
        listen 80;
        server_name 77.105.167.187; # Указываем ваш IP-адрес

        location / {
            proxy_pass http://flask_app:5000; # Указываем имя контейнера, как указано в docker-compose.yml
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
