version: '3'
services:
  flask:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    networks:
      - app-network
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80" # Открываем 80 порт для глобального доступа
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
